_target_: src.data.questgen_datamodule.QuestgenDatamodule

train_dir:  ${paths.data_dir}/questgen/train_questgen.csv
val_dir: ${paths.data_dir}/questgen/val_questgen.csv

# Specify the T5 tokenizer model, such as "t5-small"
tokenizer:
  _target_: transformers.T5Tokenizer.from_pretrained
  pretrained_model_name_or_path: t5-base

batch_size: 32  # Needs to be divisible by the number of devices (e.g., if in a distributed setup)

num_workers: 2

train_test_split: 0.2

max_len_inp: 512
max_len_out: 96

masking_chance: 0.2
